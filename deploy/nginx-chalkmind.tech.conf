# nginx site for chalkmind.tech (static files, no Node/pm2 process needed).
# Install: /etc/nginx/sites-available/chalkmind.tech  (+ symlink in sites-enabled)
# Files:   git clone https://github.com/sandeepmaddheshiya/chalkmind-web.git /var/www/chalkmind-web
# HTTPS:   sudo certbot --nginx -d chalkmind.tech -d www.chalkmind.tech
#          (certbot adds the 443/TLS lines to this file automatically)

# www.chalkmind.tech -> chalkmind.tech
server {
    listen 80;
    listen [::]:80;
    server_name www.chalkmind.tech;

    # Let certbot verify the domain over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/chalkmind-web/public; }

    location / { return 301 https://chalkmind.tech$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chalkmind.tech;

    # Only the public/ folder is served (tools, README, configs are not).
    root /var/www/chalkmind-web/public;
    index index.html;

    # Clean URLs: /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Never serve hidden files (e.g. .git), except certbot's challenge folder.
    location ~ /\.(?!well-known/) { deny all; }

    # Images/icons rarely change; CSS/HTML update often.
    location ~* \.(png|svg|ico|webp)$ { expires 30d; access_log off; }
    location ~* \.css$ { expires 10m; }

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
